name: Energie-Radar aktualisieren

on:
  schedule:
    - cron: "0 5,11,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Änderungen committen
        run: |
          git config user.name "energie-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update"
          git push
