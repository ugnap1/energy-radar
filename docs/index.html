const cats = ["Alle", ...new Set(DATA.articles.map(a => a.category))];
let cat = "Alle", term = "";
const fmtDay = d => new Date(d).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("sub").textContent =
  DATA.articles.length + " Artikel · Stand " + new Date(DATA.generated).toLocaleString("de-DE");

const chips = document.getElementById("chips");
cats.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip" + (c === cat ? " on" : "");
  b.textContent = c;
  b.onclick = () => { cat = c; [...chips.children].forEach(x => x.classList.toggle("on", x.textContent === c)); render(); };
  chips.appendChild(b);
});
document.getElementById("q").oninput = e => { term = e.target.value.toLowerCase(); render(); };

function render() {
  const rows = DATA.articles.filter(a =>
    (cat === "Alle" || a.category === cat) &&
    (!term || (a.title + " " + a.summary + " " + a.source).toLowerCase().includes(term)));
  const el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = '<div class="empty">Keine Treffer.</div>'; return; }
  let html = "", lastDay = "";
  for (const a of rows) {
    const day = fmtDay(a.date);
    if (day !== lastDay) { html += '<div class="day">' + day + "</div>"; lastDay = day; }
    html += '<article><a href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(a.title) + "</a>" +
      '<div class="meta"><span>' + esc(a.source) + '</span><span class="tag">' + esc(a.category) + "</span></div>" +
      (a.summary ? "<p>" + esc(a.summary) + "</p>" : "") + "</article>";
  }
  el.innerHTML = html;
}
render();

document.getElementById("status").innerHTML = DATA.status.map(s =>
